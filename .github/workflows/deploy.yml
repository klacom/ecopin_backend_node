name: Backend production
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Refresh system package index
        timeout-minutes: 5
        run: sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
      - name: Install native dependencies
        timeout-minutes: 5
        run: sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - run: npm ci
      - name: Syntax
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm test -- --runInBand
      - run: npm audit --omit=dev --audit-level=high
      - name: Deployment script checks
        run: |
          bash -n scripts/deploy/deploy-backend.sh
          bash -n scripts/deploy/setup-host.sh
          pwsh -File scripts/deploy/test-bootstrap.ps1
      - name: Build immutable release
        if: github.event_name != 'pull_request'
        run: |
          npm prune --omit=dev
          mkdir runtime
          cp "$(readlink -f "$(command -v node)")" runtime/node
          tar -czf release.tar.gz src data node_modules runtime package.json package-lock.json
          sha256sum release.tar.gz > release.sha256
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: backend-release
          path: |
            release.tar.gz
            release.sha256
          retention-days: 7
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-release
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::035074951255:role/ecopin-backend-github-deploy
          aws-region: ap-southeast-1
      - name: Upload and deploy
        env:
          RELEASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          bucket=ecopin-deploy-035074951255-ap-southeast-1
          aws s3 cp release.tar.gz "s3://$bucket/backend/$RELEASE.tar.gz" --only-show-errors
          aws s3 cp release.sha256 "s3://$bucket/backend/$RELEASE.sha256" --only-show-errors
          command=$(aws ssm send-command --instance-ids i-09848ea939a21db3c --document-name EcoPin-DeployBackend \
            --parameters "Release=$RELEASE" --query Command.CommandId --output text)
          for attempt in $(seq 1 90); do
            status=$(aws ssm get-command-invocation --command-id "$command" --instance-id i-09848ea939a21db3c \
              --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) echo "Backend deployment succeeded: $RELEASE"; exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$command" --instance-id i-09848ea939a21db3c \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
          exit 1
